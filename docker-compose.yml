version: "3.8"

services:
  redis:
    image: redis:7
    container_name: book-editor-redis
    ports:
      - "6379:6379"

  # Vector store for apps/chatbot's RAG knowledge base (docs/rag-chatbot-plan.md §1/§6).
  # Mapped to 5433 on the host so it never collides with a local Postgres on 5432.
  chatbot-postgres:
    image: pgvector/pgvector:pg16
    container_name: chatbot-postgres
    environment:
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: chatbot
      POSTGRES_DB: chatbot
    ports:
      - "5433:5432"
    volumes:
      - chatbot-postgres-data:/var/lib/postgresql/data

volumes:
  chatbot-postgres-data:
